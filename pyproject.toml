[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vllm-prefix-scheduler"
version = "0.1.0a0"
description = "Fixed-version vLLM prefix-aware scheduling and waiting-protection research workspace"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Atttt-3" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/Atttt-3/vllm-prefix-scheduler"
Issues = "https://github.com/Atttt-3/vllm-prefix-scheduler/issues"

[project.scripts]
prefix-evidence-check = "vllm_prefix_scheduler.evidence:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_prefix_scheduler"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/scripts", "/configs", "/docs", "/evidence", "/tests", "/requirements",
  "/README.md", "/AGENTS.md", "/CONTRIBUTING.md", "/NOTICE", "/LICENSE",
  "/Makefile", "/pyproject.toml", "/uv.lock", "/.python-version", "/.github",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "native: requires the pinned native vLLM runtime",
  "gpu: requires an allocated NVIDIA GPU",
]
